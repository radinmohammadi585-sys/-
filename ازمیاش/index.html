<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>هوش مصنوعی در مرورگر (بدون API)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 100px; padding: 0.5rem; font-size: 1rem; }
    button { margin-top: 0.5rem; padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; }
    #output { margin-top: 1rem; padding: 1rem; background: #f4f4f4; border-radius: 8px; min-height: 60px; white-space: pre-wrap; }
    #status { margin-top: 0.5rem; color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>🤖 هوش مصنوعی در مرورگر</h1>
  <p>مدل به‌طور کامل در مرورگر شما اجرا می‌شود. هیچ API خارجی استفاده نمی‌شود.</p>

  <textarea id="prompt" placeholder="مثلاً: Explain what is artificial intelligence in one sentence."></textarea>
  <button id="run">اجرای مدل</button>

  <div id="status">در حال بارگذاری کتابخانه…</div>
  <div id="output"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
